name: Behavior tests

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Optional full commit SHA from dev (e.g. an intermediate W/R/C commit)'
        required: false
        type: string
      mode:
        description: 'auto: final bundles 5/10/15... use both modes; otherwise parallel'
        required: true
        default: auto
        type: choice
        options: [auto, both]

permissions:
  contents: read

jobs:
  select:
    name: Select exact bundle revision (no full tests)
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.selection.outputs.commit_sha }}
      run_full: ${{ steps.selection.outputs.run_full }}
      mode: ${{ steps.selection.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: selection
        name: Select full gate only for final commits or manual requests
        env:
          SR_COMMIT_SHA: ${{ inputs.commit_sha }}
          SR_CI_MODE: ${{ inputs.mode || 'auto' }}
        run: python -I -B tools/select_bundle_ci.py

  behavior:
    needs: select
    if: needs.select.outputs.run_full == 'true'
    name: CPython ${{ matrix.python }} / ${{ needs.select.outputs.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development dependencies
        run: |
          python -m pip install uv==0.12.7
          uv venv --python python --no-python-downloads .venv
          uv pip install --python .venv/bin/python --link-mode copy --group dev
      - name: Validate catalog against actual collection (no tests)
        env:
          SR_CATALOG: ${{ runner.temp }}/specroad-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}-catalog.json
        run: .venv/bin/python -I -B tools/check_test_catalog.py --output "$SR_CATALOG"
      - name: Full parallel regression
        if: needs.select.outputs.mode == 'parallel'
        env:
          SR_OUT: ${{ runner.temp }}/specroad-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}
          PYTHONHASHSEED: '117'
        run: |
          mkdir -- "$SR_OUT"
          .venv/bin/python -I -B tools/run_tests.py --workers 4 --evidence "$SR_OUT/parallel-evidence.json"
      - name: Full parallel and serial regression with evidence comparison
        if: needs.select.outputs.mode == 'both'
        env:
          SR_OUT: ${{ runner.temp }}/specroad-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}
        run: .venv/bin/python -I -B tools/run_ci_tests.py --workers 4 --outdir "$SR_OUT"
      - name: Preserve development evidence (not release approval)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-${{ matrix.python }}-${{ needs.select.outputs.commit_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/specroad-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}/*.json
            ${{ runner.temp }}/specroad-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}-catalog.json
          if-no-files-found: error
          retention-days: 14
