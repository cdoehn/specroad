name: Behavior tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavior:
    name: CPython ${{ matrix.python }} / Ubuntu
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development dependencies
        run: |
          python -m pip install uv==0.12.7
          uv venv --python python --no-python-downloads .venv
          uv pip install --python .venv/bin/python --link-mode copy --group dev
      - name: Execute parallel behavior gate
        run: .venv/bin/python -I -B tools/run_tests.py --evidence build/parallel-evidence.json
      - name: Execute serial reference gate
        if: success() || failure()
        run: .venv/bin/python -I -B tools/run_tests.py --workers 0 --evidence build/serial-evidence.json
      - name: Compare serial and parallel current-run evidence
        run: .venv/bin/python -I -B tools/compare_test_runs.py build/parallel-evidence.json build/serial-evidence.json
      - name: Preserve development evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-ubuntu-python-${{ matrix.python }}
          path: |
            build/parallel-evidence.json
            build/serial-evidence.json
          if-no-files-found: error
          retention-days: 14
      # No presentation/doc tests or test/suite timeouts. Not a release gate.
