name: Full regression (manual)
run-name: Full regression · ${{ inputs.commit_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Optional full SHA reachable from dev; empty tests the exact dispatch revision'
        required: false
        type: string
      runner:
        description: 'Fresh Hetzner availability check, with explicit Ubuntu 24.04 fallback'
        required: true
        default: auto
        type: choice
        options: [auto, hetzner, github-hosted]

# No push, pull_request, schedule or bundle-number trigger. The small hosted
# selector can check an offline self-hosted runner without queueing on it.
# Optional SPECROAD_RUNNER_READ_TOKEN: repository Administration:read.
# An unavailable/unauthorized probe falls back explicitly; no success is invented
# if hosted Actions cannot run either. The probe is not a runner reservation.
permissions:
  contents: read
  actions: read

jobs:
  select:
    name: Select exact manual revision and available runner (no full tests)
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.selection.outputs.runner }}
      commit_sha: ${{ steps.selection.outputs.commit_sha }}
      run_full: ${{ steps.selection.outputs.run_full }}
      mode: ${{ steps.selection.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: selection
        name: Bind manual full run and probe Hetzner availability
        env:
          GH_TOKEN: ${{ secrets.SPECROAD_RUNNER_READ_TOKEN || github.token }}
          SR_CI_RUNNER: ${{ inputs.runner }}
          SR_COMMIT_SHA: ${{ inputs.commit_sha }}
          SR_CI_MODE: parallel
          SR_SELECTION_REPORT: ${{ runner.temp }}/specroad-selection-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: python -I -B tools/select_bundle_ci.py
      - name: Preserve runner selection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selection-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/specroad-selection-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 14

  plan:
    needs: select
    if: needs.select.outputs.run_full == 'true'
    name: Plan CPython ${{ matrix.python }} packages
    runs-on: ${{ fromJSON(needs.select.outputs.runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      SR_TEST_SHA: ${{ needs.select.outputs.commit_sha }}
    steps:
      - name: Initialize bound CI paths on runner
        shell: bash
        env:
          SR_PYTHON: ${{ matrix.python }}
        run: |
          printf '%s\n' \
            "SR_PLAN=${RUNNER_TEMP}/ci-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SR_PYTHON}" \
            >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development dependencies
        run: |
          python -m pip install uv==0.12.7
          uv venv --python python --no-python-downloads .venv
          uv pip install --python .venv/bin/python --link-mode copy --group dev
      - name: Collect complete suite and balance three-hour packages
        run: .venv/bin/python -I -B tools/ci_packages.py plan --outdir "$SR_PLAN"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}
          path: ${{ env.SR_PLAN }}/*.json
          if-no-files-found: error
          retention-days: 14

  matrix:
    needs: [select, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/ci-plans
          merge-multiple: false
      - id: matrix
        name: Verify complete matrix and 256-job limit
        env:
          SR_PLANS: ${{ runner.temp }}/ci-plans
        run: python -I -B tools/ci_packages.py matrix --plans "$SR_PLANS"

  packages:
    needs: [select, matrix]
    name: CPython ${{ matrix.python }} / package ${{ matrix.shard }}
    runs-on: ${{ fromJSON(needs.select.outputs.runner) }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.packages) }}
    env:
      SR_TEST_SHA: ${{ needs.select.outputs.commit_sha }}
      SR_PACKAGE: ${{ matrix.shard }}
    steps:
      - name: Initialize bound CI paths on runner
        shell: bash
        env:
          SR_PYTHON: ${{ matrix.python }}
        run: |
          printf '%s\n' \
            "SR_PLAN=${RUNNER_TEMP}/ci-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SR_PYTHON}" \
            "SR_OUT=${RUNNER_TEMP}/ci-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SR_PYTHON}-${SR_PACKAGE}" \
            >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development dependencies
        run: |
          python -m pip install uv==0.12.7
          uv venv --python python --no-python-downloads .venv
          uv pip install --python .venv/bin/python --link-mode copy --group dev
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}
          path: ${{ env.SR_PLAN }}
      - name: Run exact package with worksteal
        timeout-minutes: 300
        run: .venv/bin/python -I -B tools/ci_packages.py run --plan "$SR_PLAN/plan.json" --shard "$SR_PACKAGE" --outdir "$SR_OUT"
      - name: Preserve durable native runtime history including partial attempts
        if: always()
        run: .venv/bin/python -I -B tools/ci_packages.py preserve-history --output "$SR_OUT/runtime-history.sqlite3"
      - name: Preserve package evidence and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}-${{ matrix.shard }}
          path: ${{ env.SR_OUT }}/*
          if-no-files-found: error
          retention-days: 14

  behavior:
    needs: [select, plan, matrix, packages]
    if: always() && needs.plan.result == 'success' && needs.matrix.result == 'success'
    name: CPython ${{ matrix.python }} / parallel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      SR_TEST_SHA: ${{ needs.select.outputs.commit_sha }}
    steps:
      - name: Initialize bound CI paths on runner
        shell: bash
        env:
          SR_PYTHON: ${{ matrix.python }}
        run: |
          printf '%s\n' \
            "SR_PLAN=${RUNNER_TEMP}/ci-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SR_PYTHON}" \
            "SR_RECEIPTS=${RUNNER_TEMP}/ci-receipts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SR_PYTHON}" \
            "SR_OUT=${RUNNER_TEMP}/ci-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SR_PYTHON}" \
            >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development dependencies
        run: |
          python -m pip install uv==0.12.7
          uv venv --python python --no-python-downloads .venv
          uv pip install --python .venv/bin/python --link-mode copy --group dev
      - uses: actions/download-artifact@v8
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}
          path: ${{ env.SR_PLAN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}-*
          path: ${{ env.SR_RECEIPTS }}
          merge-multiple: false
      - name: Full parallel regression
        run: .venv/bin/python -I -B tools/ci_packages.py aggregate --plan "$SR_PLAN/plan.json" --receipts "$SR_RECEIPTS" --outdir "$SR_OUT"
      - name: Preserve development evidence (not release approval)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-${{ matrix.python }}-${{ needs.select.outputs.commit_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ env.SR_OUT }}/*.json
          if-no-files-found: error
          retention-days: 14
