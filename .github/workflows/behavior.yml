name: Behavior tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavior:
    name: CPython ${{ matrix.python }} / Ubuntu
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development dependencies
        run: |
          python -m pip install uv==0.12.7
          uv venv --python python --no-python-downloads .venv
          uv pip install --python .venv/bin/python --link-mode copy --group dev
      - name: Execute parallel gate, serial CI reference and compare evidence
        run: >-
          .venv/bin/python -I -B tools/run_ci_tests.py
          --workers 4
          --outdir "${{ runner.temp }}/specroad-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}"
      - name: Preserve development evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-ubuntu-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/specroad-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python }}/*.json
          if-no-files-found: error
          retention-days: 14
      # Preparation only: no repository creation, remote or push by this file.
      # No presentation/doc tests or test/suite timeouts. Not a release gate.
