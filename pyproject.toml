[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specroad"
dynamic = ["version"]
description = "Single-repository specification workbench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
specroad = "specroad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["specroad*"]

[tool.setuptools.dynamic]
version = {attr = "specroad._metadata.__version__"}
