[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specroad"
dynamic = ["version"]
description = "Single-repository specification workbench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
specroad = "specroad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["specroad*"]

[tool.setuptools.dynamic]
version = {attr = "specroad._metadata.__version__"}

# Development only. Neither package is included in Core distributions.
[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-xdist==3.8.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
python_files = ["test_*.py"]
addopts = "--disable-plugin-autoload -p no:cacheprovider -p no:doctest -p xdist.plugin -n auto --dist load --max-worker-restart=0"

[tool.setuptools.package-data]
"specroad.language_data" = ["registry.txt", "snapshot.json"]
